events {}

http {
    # HTTP → HTTPS
    server {
        listen 80;
        server_name ensanemanavi.ir api.ensanemanavi.ir;

        return 301 https://$host$request_uri;
    }

    # Main domain
    server {
        listen 443 ssl;
        server_name ensanemanavi.ir;

        ssl_certificate /etc/nginx/certs/origin-cert.pem;
        ssl_certificate_key /etc/nginx/certs/origin-key.pem;

        location /api/ {
            proxy_pass http://backend:8000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API subdomain
    server {
        listen 443 ssl;
        server_name api.ensanemanavi.ir;

        ssl_certificate /etc/nginx/certs/origin-cert.pem;
        ssl_certificate_key /etc/nginx/certs/origin-key.pem;

        location / {
            proxy_pass http://backend:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}