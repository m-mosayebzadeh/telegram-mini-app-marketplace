<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600&display=swap">
  <style>
    body { margin: 0; }
    .ob { font-family: 'Noto Kufi Arabic', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ob" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 74%, #10262a 0%, #0a1417 46%, #060b0d 100%); color: #e7f0ef;">

  <!-- Activity is time, and in this language time is distance too: what just
       happened is near the thumb, what is old has drifted out. Same ring
       grammar as Discover, so there is one idea to learn, not two. -->
  <div style="position: absolute; left: 24px; top: 58px; font-size: 20px;">در حال گذشتن</div>

  <div style="position: absolute; left: 50%; top: 700px; width: 340px; height: 340px; margin-left: -170px;
              margin-top: -170px; border-radius: 50%; border: 1px solid rgba(122,215,200,.18);"></div>
  <div style="position: absolute; left: 50%; top: 700px; width: 580px; height: 580px; margin-left: -290px;
              margin-top: -290px; border-radius: 50%; border: 1px solid rgba(122,215,200,.10);"></div>
  <div style="position: absolute; left: 50%; top: 700px; width: 820px; height: 820px; margin-left: -410px;
              margin-top: -410px; border-radius: 50%; border: 1px solid rgba(122,215,200,.06);"></div>

  <!-- Nearest ring: live. One line, no card, money stated plainly. -->
  <div style="position: absolute; right: 26px; top: 552px; left: 26px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(145deg,#2f6f68,#14403d);
                display: flex; align-items: center; justify-content: center; font-size: 18px;
                box-shadow: 0 0 0 2px #7ad7c8;">م</div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13.5px;">گفتگو با مهتاب در جریان است</div>
      <div style="margin-top: 4px; font-size: 11px; color: #7ad7c8;">۵۰ دراپ فریز · ۱۲ دقیقه مانده</div>
    </div>
  </div>

  <div style="position: absolute; right: 26px; left: 26px; top: 460px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg,#3a4a63,#1b2434);
                display: flex; align-items: center; justify-content: center; font-size: 16px;
                color: #ccd7ea;">آ</div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13px; color: rgba(231,240,239,.86);">آرش درخواست گفتگو داده</div>
      <div style="margin-top: 4px; font-size: 11px; color: rgba(231,240,239,.46);">۱۸ ساعت تا انقضا</div>
    </div>
    <div style="min-height: 36px; display: flex; align-items: center; padding: 0 14px; border-radius: 18px;
                border: 1px solid rgba(122,215,200,.4); color: #7ad7c8; font-size: 12px;">بپذیر</div>
  </div>

  <!-- Second ring: finished, settled, dimmer. -->
  <div style="position: absolute; right: 26px; left: 26px; top: 372px; display: flex; align-items: center; gap: 12px;
              opacity: .74;">
    <div style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(145deg,#2f5a4a,#152b24);
                display: flex; align-items: center; justify-content: center; font-size: 14px;">ک</div>
    <div style="flex-grow: 1;">
      <div style="font-size: 12.5px;">گفتگو با کیان تمام شد</div>
      <div style="margin-top: 3px; font-size: 10.5px; color: rgba(231,240,239,.42);">۷۵ دراپ به تو رسید · دیروز</div>
    </div>
  </div>

  <div style="position: absolute; right: 26px; left: 26px; top: 300px; display: flex; align-items: center; gap: 12px;
              opacity: .56;">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(145deg,#3c3352,#1d1a2a);"></div>
    <div style="flex-grow: 1;">
      <div style="font-size: 12px;">یک نفر «شب‌های تهران» را خرید</div>
      <div style="margin-top: 3px; font-size: 10.5px; color: rgba(231,240,239,.38);">۱۸ دراپ · سه روز پیش</div>
    </div>
  </div>

  <div style="position: absolute; right: 26px; left: 26px; top: 238px; display: flex; align-items: center; gap: 12px;
              opacity: .34; font-size: 11.5px;">
    <div style="width: 26px; height: 26px; border-radius: 50%; background: rgba(231,240,239,.10);"></div>
    <div>درخواست رها منقضی شد</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 176px; text-align: center; font-size: 10px;
              letter-spacing: .16em; color: rgba(231,240,239,.22);">قدیمی‌تر</div>

  <!-- Navigation, radiated. Holding the core throws the five sections out along
       the ring; the thumb never leaves the bottom third and there is no tab bar
       eating 56 vertical pixels on every screen. -->
  <div style="position: absolute; left: 50%; top: 700px; margin-left: -37px; margin-top: -37px;
              width: 74px; height: 74px; border-radius: 50%;
              background: radial-gradient(circle at 34% 30%, #f2b06a, #b96f2e);
              box-shadow: 0 0 0 10px rgba(242,176,106,.12), 0 0 60px rgba(242,176,106,.35);"></div>

  <div style="position: absolute; left: 32px; top: 620px; min-height: 44px; display: flex; align-items: center;
              padding: 0 16px; border-radius: 22px; background: rgba(9,20,22,.9);
              border: 1px solid rgba(242,176,106,.34); font-size: 12.5px;">کشف</div>
  <div style="position: absolute; right: 32px; top: 620px; min-height: 44px; display: flex; align-items: center;
              padding: 0 16px; border-radius: 22px; background: rgba(9,20,22,.9);
              border: 1px solid rgba(242,176,106,.34); font-size: 12.5px;">کیف</div>
  <div style="position: absolute; left: 96px; top: 712px; min-height: 44px; display: flex; align-items: center;
              padding: 0 16px; border-radius: 22px; background: rgba(9,20,22,.9);
              border: 1px solid rgba(242,176,106,.5); color: #f2b06a; font-size: 12.5px;">فعالیت</div>
  <div style="position: absolute; right: 96px; top: 712px; min-height: 44px; display: flex; align-items: center;
              padding: 0 16px; border-radius: 22px; background: rgba(9,20,22,.9);
              border: 1px solid rgba(242,176,106,.34); font-size: 12.5px;">من</div>

</div>
</x-dc>
</body>
</html>
