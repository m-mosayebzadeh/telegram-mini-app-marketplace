<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .pp { font-family: 'Vazirmatn', system-ui, sans-serif; }
    .pp-ink { border: 2.5px solid #16150f; }
  </style>
</helmet>

<div class="pp" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden;
  background: #f5eee1; color: #16150f;">

  <!-- Every event in this product leaves a receipt, so activity is drawn as a
       spike of them. Status is the paper's colour and nothing else: yellow is
       live, blue is settled, grey is dead. -->
  <div style="position: absolute; top: 40px; right: 22px; left: 22px; display: flex; align-items: baseline;
              justify-content: space-between;">
    <div style="font-size: 26px; font-weight: 900;">رسیدها</div>
    <div style="font-size: 12px; font-weight: 700; color: rgba(22,21,15,.5);">۲۴ شهریور</div>
  </div>
  <div style="position: absolute; top: 82px; right: 22px; left: 22px; height: 4px; background: #16150f;"></div>

  <!-- Wallet is printed at the top as a cheque, not hidden in a fourth tab. -->
  <div class="pp-ink" style="position: absolute; top: 104px; right: 22px; left: 22px; height: 96px;
              background: #b9cdff; box-shadow: 6px 6px 0 #16150f; padding: 14px 16px; box-sizing: border-box;">
    <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .14em;">موجودی</div>
    <div style="margin-top: 6px; display: flex; align-items: baseline; gap: 8px;">
      <div style="font-size: 38px; font-weight: 900; line-height: 1;">۴۲۰</div>
      <div style="font-size: 12px; font-weight: 700;">دراپ</div>
    </div>
    <div style="margin-top: 8px; font-size: 11px; font-weight: 500;">۵۰ فریز · ۲۴۸ قابل برداشت</div>
  </div>

  <div class="pp-ink" style="position: absolute; top: 216px; right: 22px; left: 22px; height: 66px;
              background: #ffe45e; box-shadow: 5px 5px 0 #16150f; transform: rotate(-1deg);
              display: flex; align-items: center; padding: 0 14px; box-sizing: border-box; gap: 12px;">
    <div class="pp-ink" style="width: 36px; height: 36px; background: #ff5470;"></div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13.5px; font-weight: 900;">گفتگو با مهتاب در جریان</div>
      <div style="margin-top: 3px; font-size: 10.5px; font-weight: 500;">۵۰ دراپ فریز · ۱۲ دقیقه</div>
    </div>
    <div style="font-size: 16px; font-weight: 900;">←</div>
  </div>

  <div class="pp-ink" style="position: absolute; top: 300px; right: 22px; left: 22px; height: 66px;
              background: #ffffff; box-shadow: 5px 5px 0 #16150f; transform: rotate(.7deg);
              display: flex; align-items: center; padding: 0 14px; box-sizing: border-box; gap: 12px;">
    <div class="pp-ink" style="width: 36px; height: 36px; background: #b9cdff;"></div>
    <div style="flex-grow: 1;">
      <div style="font-size: 13.5px; font-weight: 700;">آرش درخواست داده</div>
      <div style="margin-top: 3px; font-size: 10.5px; font-weight: 500; color: rgba(22,21,15,.55);">
        ۱۸ ساعت تا انقضا</div>
    </div>
    <div class="pp-ink" style="height: 34px; background: #ff5470; color: #fff6f2; display: flex;
                align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 900;">بپذیر</div>
  </div>

  <div class="pp-ink" style="position: absolute; top: 384px; right: 22px; left: 22px; height: 58px;
              background: #ffffff; box-shadow: 4px 4px 0 #16150f; transform: rotate(-.5deg);
              display: flex; align-items: center; padding: 0 14px; box-sizing: border-box; gap: 12px;">
    <div class="pp-ink" style="width: 30px; height: 30px; background: #d8d2c4;"></div>
    <div style="flex-grow: 1; font-size: 13px; font-weight: 700;">گفتگو با کیان تمام شد
      <div style="margin-top: 2px; font-size: 10px; font-weight: 500; color: rgba(22,21,15,.5);">دیروز</div></div>
    <div style="font-size: 15px; font-weight: 900; color: #2b4bd0;">‎+۷۵</div>
  </div>

  <div class="pp-ink" style="position: absolute; top: 458px; right: 22px; left: 22px; height: 58px;
              background: #ffffff; box-shadow: 4px 4px 0 #16150f; transform: rotate(.9deg);
              display: flex; align-items: center; padding: 0 14px; box-sizing: border-box; gap: 12px;">
    <div class="pp-ink" style="width: 30px; height: 30px; background: #d8d2c4;"></div>
    <div style="flex-grow: 1; font-size: 13px; font-weight: 700;">فروش «شب‌های تهران»</div>
    <div style="font-size: 15px; font-weight: 900; color: #2b4bd0;">‎+۱۸</div>
  </div>

  <div style="position: absolute; top: 532px; right: 22px; left: 22px; height: 52px; border: 2.5px dashed
              rgba(22,21,15,.28); display: flex; align-items: center; padding: 0 14px; box-sizing: border-box;
              gap: 12px; color: rgba(22,21,15,.45);">
    <div style="flex-grow: 1; font-size: 12.5px; font-weight: 700;">درخواست رها منقضی شد</div>
    <div style="font-size: 13px; font-weight: 900;">—</div>
  </div>

  <div class="pp-ink" style="position: absolute; left: 22px; right: 22px; bottom: 96px; height: 54px;
              background: #f5eee1; display: flex; align-items: center; justify-content: center;
              font-size: 14px; font-weight: 900; box-shadow: 5px 5px 0 #16150f;">برداشت ۲۴۸ دراپ</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #16150f;
              display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; gap: 8px;">
    <div style="flex: 1; height: 44px; color: #f5eee1; display: flex; align-items: center;
                justify-content: center; font-size: 12.5px; font-weight: 500;">دسته</div>
    <div style="flex: 1; height: 44px; background: #ffe45e; border: 2.5px solid #16150f; display: flex;
                align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700;">رسیدها</div>
    <div style="flex: 1; height: 44px; color: #f5eee1; display: flex; align-items: center;
                justify-content: center; font-size: 12.5px; font-weight: 500;">کیف</div>
    <div style="flex: 1; height: 44px; color: #f5eee1; display: flex; align-items: center;
                justify-content: center; font-size: 12.5px; font-weight: 500;">من</div>
  </div>

</div>
</x-dc>
</body>
</html>
