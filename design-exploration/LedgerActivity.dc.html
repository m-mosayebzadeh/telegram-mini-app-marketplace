<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;700&display=swap">
  <style>
    body { margin: 0; }
    .lg { font-family: 'Vazirmatn', system-ui, sans-serif; }
    .lg-rule { height: 1px; background: rgba(22,19,15,.22); }
    .lg-cell { font-size: 12.5px; }
  </style>
</helmet>

<div class="lg" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden;
  background: #f4efe4; color: #16130f;">

  <!-- Activity and money are the same page here, because in this product they
       are the same thing. A real ledger: date, description, amount, balance. -->
  <div style="position: absolute; top: 46px; right: 24px; left: 24px;">
    <div style="font-size: 11px; letter-spacing: .3em; color: rgba(22,19,15,.45);">حســـاب</div>
    <div style="margin-top: 18px; display: flex; align-items: baseline; gap: 10px;">
      <div style="font-size: 52px; font-weight: 300; line-height: 1;">۴۲۰</div>
      <div style="font-size: 14px; color: rgba(22,19,15,.5);">دراپ</div>
    </div>
    <div style="margin-top: 8px; font-size: 12px; color: rgba(22,19,15,.55);">
      از این مقدار <span style="color: #b3341f;">۵۰ دراپ</span> فریز است
    </div>
    <div class="lg-rule" style="margin-top: 20px; background: #16130f; height: 2px;"></div>
  </div>

  <!-- Column heads, once. After that the eye reads down the columns without
       any repeated labels - the thing a card list can never do. -->
  <div style="position: absolute; top: 232px; right: 24px; left: 24px; display: flex; font-size: 10px;
              letter-spacing: .18em; color: rgba(22,19,15,.4); padding-bottom: 8px;">
    <div style="width: 54px;">تاریخ</div>
    <div style="flex-grow: 1;">شرح</div>
    <div style="width: 74px; text-align: left;">مبلغ</div>
  </div>

  <div style="position: absolute; top: 264px; right: 24px; left: 24px;">
    <div class="lg-rule"></div>
    <div style="display: flex; align-items: baseline; padding: 13px 0;">
      <div class="lg-cell" style="width: 54px; color: rgba(22,19,15,.5);">امروز</div>
      <div class="lg-cell" style="flex-grow: 1;">گفتگو در جریان<br>
        <span style="font-size: 10.5px; color: rgba(22,19,15,.45);">فریز تا پایان</span></div>
      <div class="lg-cell" style="width: 74px; text-align: left; color: rgba(22,19,15,.45);">−۵۰</div>
    </div>

    <div class="lg-rule"></div>
    <div style="display: flex; align-items: baseline; padding: 13px 0;">
      <div class="lg-cell" style="width: 54px; color: rgba(22,19,15,.5);">امروز</div>
      <div class="lg-cell" style="flex-grow: 1;">درخواست تازه از آرش<br>
        <span style="font-size: 10.5px; color: rgba(22,19,15,.45);">۱۸ ساعت تا انقضا</span></div>
      <div class="lg-cell" style="width: 74px; text-align: left; color: rgba(22,19,15,.35);">—</div>
    </div>

    <div class="lg-rule"></div>
    <div style="display: flex; align-items: baseline; padding: 13px 0;">
      <div class="lg-cell" style="width: 54px; color: rgba(22,19,15,.5);">دیروز</div>
      <div class="lg-cell" style="flex-grow: 1;">گفتگو با کیان تمام شد</div>
      <div class="lg-cell" style="width: 74px; text-align: left; color: #b3341f;">‎+۷۵</div>
    </div>

    <div class="lg-rule"></div>
    <div style="display: flex; align-items: baseline; padding: 13px 0;">
      <div class="lg-cell" style="width: 54px; color: rgba(22,19,15,.5);">۲۱/۰۶</div>
      <div class="lg-cell" style="flex-grow: 1;">فروش «شب‌های تهران»</div>
      <div class="lg-cell" style="width: 74px; text-align: left; color: #b3341f;">‎+۱۸</div>
    </div>

    <div class="lg-rule"></div>
    <div style="display: flex; align-items: baseline; padding: 13px 0; color: rgba(22,19,15,.45);">
      <div class="lg-cell" style="width: 54px;">۲۰/۰۶</div>
      <div class="lg-cell" style="flex-grow: 1;">درخواست رها منقضی شد</div>
      <div class="lg-cell" style="width: 74px; text-align: left;">—</div>
    </div>
    <div class="lg-rule"></div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 122px; min-height: 52px;
              border: 2px solid #16130f; display: flex; align-items: center; justify-content: center;
              font-size: 14px;">برداشت</div>

  <!-- Same running foot as every other page: four words, one rule. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; padding: 0 24px;
              box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;
              border-top: 2px solid #16130f; font-size: 12.5px;">
    <span style="color: rgba(22,19,15,.5);">دفتر</span>
    <span style="color: rgba(22,19,15,.5);">فعالیت</span>
    <span style="border-bottom: 2px solid #b3341f; padding-bottom: 2px;">حساب</span>
    <span style="color: rgba(22,19,15,.5);">من</span>
  </div>

</div>
</x-dc>
</body>
</html>
