<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap">
  <style>
    body { margin: 0; }
    .dp { font-family: 'Vazirmatn', system-ui, sans-serif; }
  </style>
</helmet>

<div class="dp" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden;
  background: linear-gradient(180deg,#e9eef1 0%, #dde5ea 42%, #c9d6de 100%); color: #10202b;">

  <!-- Aerial perspective, borrowed from landscape painting: what is far is
       pale, small and soft; what is near is dark, large and sharp. There are no
       cards, no borders and no dividers anywhere on this screen - depth does
       every job they would have done, and it needs no pixels of its own. -->

  <!-- Far: people you have never met. Unreadable on purpose - reaching one
       pulls it forward. -->
  <div style="position: absolute; top: 96px; right: 30px; filter: blur(3.5px); opacity: .5;">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #9fb3bf;"></div>
  </div>
  <div style="position: absolute; top: 74px; left: 62px; filter: blur(4px); opacity: .45;">
    <div style="width: 34px; height: 34px; border-radius: 50%; background: #a9bcc6;"></div>
  </div>
  <div style="position: absolute; top: 148px; left: 24px; filter: blur(2.6px); opacity: .6;">
    <div style="width: 46px; height: 46px; border-radius: 50%; background: #93aab8;"></div>
  </div>
  <div style="position: absolute; top: 122px; right: 120px; filter: blur(3px); opacity: .5;">
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #9db2be;"></div>
  </div>

  <div style="position: absolute; top: 40px; right: 26px; font-size: 12px; letter-spacing: .18em;
              color: rgba(16,32,43,.35);">دورتر · ۱۹ نفر</div>

  <!-- Middle: people who have already reached toward you. -->
  <div style="position: absolute; top: 236px; right: 26px; filter: blur(.6px); display: flex;
              align-items: center; gap: 12px; opacity: .9;">
    <div style="width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(150deg,#8fa6b4,#6d8494);"></div>
    <div>
      <div style="font-size: 15px; font-weight: 300;">آرش</div>
      <div style="margin-top: 3px; font-size: 11.5px; color: rgba(16,32,43,.5);">۱۸۰ دراپ</div>
    </div>
  </div>

  <div style="position: absolute; top: 318px; left: 26px; filter: blur(.4px); display: flex;
              align-items: center; gap: 12px; flex-direction: row-reverse; opacity: .94;">
    <div style="width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(150deg,#b39a93,#8a6f68);"></div>
    <div style="text-align: left;">
      <div style="font-size: 15.5px; font-weight: 300;">نگار</div>
      <div style="margin-top: 3px; font-size: 11.5px; color: rgba(16,32,43,.5);">۸۰ دراپ</div>
    </div>
  </div>

  <!-- Near: the one the app is actually proposing. Largest, sharpest, darkest,
       and inside the thumb's arc - three different signals all saying the same
       thing, which is why this reads instantly with no label. -->
  <div style="position: absolute; top: 430px; right: 26px; left: 26px;">
    <div style="display: flex; align-items: flex-end; gap: 16px;">
      <div style="width: 118px; height: 148px; border-radius: 24px;
                  background: linear-gradient(160deg,#4d6b7d,#22384a);
                  box-shadow: 0 26px 60px rgba(16,32,43,.28);"></div>
      <div style="padding-bottom: 8px;">
        <div style="font-size: 30px; font-weight: 300;">مهتاب</div>
        <div style="margin-top: 8px; font-size: 13px; line-height: 1.85; color: rgba(16,32,43,.65);">
          شب‌ها بیدارم و<br>وسط حرف کسی نمی‌پرم.
        </div>
      </div>
    </div>

    <div style="margin-top: 22px; display: flex; align-items: baseline; gap: 10px;">
      <div style="font-size: 26px; font-weight: 300; color: #d4573c;">۱۰۰</div>
      <div style="font-size: 12.5px; color: rgba(16,32,43,.5);">دراپ برای نیم‌ساعت</div>
    </div>
  </div>

  <!-- The action is a plane of its own, floating nearest of all. Not a button
       drawn on the page: the closest thing in the scene. -->
  <div style="position: absolute; left: 26px; right: 26px; bottom: 106px; min-height: 56px;
              border-radius: 28px; background: #10202b; color: #eef3f6; display: flex;
              align-items: center; justify-content: center; font-size: 15px;
              box-shadow: 0 18px 44px rgba(16,32,43,.32);">نزدیک‌تر شو</div>

  <!-- Navigation is depth. The rail on the edge says which layer you are on;
       dragging the whole surface down surfaces the layer above it, so there is
       no tab bar and no back button - only one gesture, everywhere. -->
  <div style="position: absolute; left: 12px; top: 300px; display: flex; flex-direction: column;
              align-items: center; gap: 9px;">
    <div style="width: 3px; height: 30px; border-radius: 2px; background: #10202b;"></div>
    <div style="width: 3px; height: 16px; border-radius: 2px; background: rgba(16,32,43,.24);"></div>
    <div style="width: 3px; height: 16px; border-radius: 2px; background: rgba(16,32,43,.24);"></div>
    <div style="width: 3px; height: 16px; border-radius: 2px; background: rgba(16,32,43,.24);"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font-size: 11px;
              color: rgba(16,32,43,.34);">برای لایه‌ی بعد، صفحه را پایین بکش</div>

  <!-- The running conversation is the only thing allowed to sit above the
       surface, because it is the only thing that is costing money right now. -->
  <div style="position: absolute; left: 26px; right: 26px; bottom: 16px; min-height: 34px;
              border-radius: 17px; background: rgba(212,87,60,.14); display: flex; align-items: center;
              justify-content: center; gap: 8px; font-size: 11.5px; color: #a93f28;">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: #d4573c;"></span>
    گفتگو با مهتاب · ۱۲ دقیقه
  </div>

</div>
</x-dc>
</body>
</html>
