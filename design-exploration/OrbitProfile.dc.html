<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7ad7c8; } a:hover { color: #a6e7dc; }
    .ob { font-family: 'Noto Kufi Arabic', system-ui, sans-serif; }
  </style>
</helmet>

<div class="ob" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden;
  background: radial-gradient(110% 55% at 50% 18%, #13282c 0%, #0a1417 50%, #060b0d 100%); color: #e7f0ef;">

  <!-- A profile is a small world, so it is drawn as one: the person at the
       centre, and everything about them held in orbit around them. Content is
       not a grid below - it is what is circling. -->
  <div style="position: absolute; left: 50%; top: 232px; margin-left: -140px; margin-top: -140px;
              width: 280px; height: 280px; border-radius: 50%; border: 1px solid rgba(122,215,200,.14);"></div>
  <div style="position: absolute; left: 50%; top: 232px; margin-left: -180px; margin-top: -180px;
              width: 360px; height: 360px; border-radius: 50%; border: 1px solid rgba(122,215,200,.08);"></div>

  <div style="position: absolute; left: 50%; top: 232px; margin-left: -54px; margin-top: -54px;
              width: 108px; height: 108px; border-radius: 50%;
              background: linear-gradient(150deg,#357a72,#153f3c); display: flex; align-items: center;
              justify-content: center; font-size: 38px; color: #e2f6f1;
              box-shadow: 0 0 0 1px rgba(122,215,200,.5), 0 18px 50px rgba(0,0,0,.5);">م</div>

  <!-- Content, in orbit. Locked pieces read as unlit; you can see one is there
       without seeing it, which is the whole point of a spoiler. -->
  <div style="position: absolute; left: 44px; top: 150px; width: 62px; height: 62px; border-radius: 14px;
              background: linear-gradient(140deg,#2b4f58,#16292f); border: 1px solid rgba(122,215,200,.22);"></div>
  <div style="position: absolute; right: 42px; top: 166px; width: 54px; height: 54px; border-radius: 13px;
              background: rgba(231,240,239,.06); border: 1px dashed rgba(231,240,239,.22);
              display: flex; align-items: center; justify-content: center; font-size: 10px;
              color: rgba(231,240,239,.5);">۲۰</div>
  <div style="position: absolute; left: 76px; top: 300px; width: 50px; height: 50px; border-radius: 12px;
              background: linear-gradient(140deg,#3c3352,#1d1a2a); border: 1px solid rgba(231,240,239,.12);"></div>
  <div style="position: absolute; right: 70px; top: 312px; width: 46px; height: 46px; border-radius: 12px;
              background: rgba(231,240,239,.05); border: 1px dashed rgba(231,240,239,.18);
              display: flex; align-items: center; justify-content: center; font-size: 10px;
              color: rgba(231,240,239,.45);">۱۵</div>

  <div style="position: absolute; left: 0; right: 0; top: 372px; text-align: center;">
    <div style="font-size: 23px; letter-spacing: .01em;">مهتاب</div>
    <div style="margin-top: 7px; font-size: 12px; color: rgba(231,240,239,.5);">تهران · شب‌ها بیدار</div>
  </div>

  <!-- Three numbers, and only three. Each is something a stranger actually
       needs before spending money on a conversation. -->
  <div style="position: absolute; left: 0; right: 0; top: 432px; display: flex; justify-content: center;
              gap: 38px; text-align: center;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 19px; color: #7ad7c8;">۴۸</div>
      <div style="font-size: 10.5px; color: rgba(231,240,239,.44);">گفتگو</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 19px; color: #7ad7c8;">۴٫۸</div>
      <div style="font-size: 10.5px; color: rgba(231,240,239,.44);">امتیاز</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 19px; color: #7ad7c8;">۹۴٪</div>
      <div style="font-size: 10.5px; color: rgba(231,240,239,.44);">پاسخ‌دهی</div>
    </div>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 512px; font-size: 13.5px; line-height: 2;
              color: rgba(231,240,239,.72); text-align: center;">
    دیر می‌خوابم و از حرف زدن درباره‌ی چیزهایی که هیچ‌کس نمی‌پرسد خسته نمی‌شوم.
  </div>

  <!-- Their offer is not a card in a list; it is the nearest thing to you. -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 132px; padding: 18px 20px;
              border-radius: 22px; background: rgba(122,215,200,.07);
              border: 1px solid rgba(122,215,200,.24);">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 15px;">گفتگوی شبانه</div>
      <div style="font-size: 15px; color: #7ad7c8;">۱۰۰ دراپ</div>
    </div>
    <div style="margin-top: 8px; font-size: 11.5px; color: rgba(231,240,239,.5);">
      ۳۰ دقیقه · چهار بلوک ۷٫۵ دقیقه‌ای
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 64px; min-height: 52px; border-radius: 26px;
              background: #7ad7c8; color: #06181a; display: flex; align-items: center; justify-content: center;
              font-size: 15px;">درخواست گفتگو</div>

</div>
</x-dc>
</body>
</html>
