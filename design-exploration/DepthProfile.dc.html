<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap">
  <style>
    body { margin: 0; }
    .dp { font-family: 'Vazirmatn', system-ui, sans-serif; }
  </style>
</helmet>

<div class="dp" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden;
  background: linear-gradient(180deg,#e9eef1 0%, #dde5ea 46%, #c5d3dc 100%); color: #10202b;">

  <!-- The portrait is the far plane and the whole background; everything you
       can act on floats in front of it. That ordering is the argument of this
       concept: the person is the context, the decision is the foreground. -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 420px;
              background: linear-gradient(170deg,#5d7b8d,#2a4257 70%, #1d3244);"></div>
  <div style="position: absolute; top: 300px; left: 0; right: 0; height: 160px;
              background: linear-gradient(180deg, rgba(221,229,234,0), #dde5ea 78%);"></div>

  <div style="position: absolute; top: 210px; right: 26px; left: 26px; color: #f0f5f8;">
    <div style="font-size: 38px; font-weight: 200;">مهتاب</div>
    <div style="margin-top: 8px; font-size: 12.5px; opacity: .72;">تهران · شب‌ها بیدار</div>
  </div>

  <!-- Facts sit just behind the surface: readable, not clickable, no boxes. -->
  <div style="position: absolute; top: 386px; right: 26px; left: 26px; display: flex; gap: 30px;">
    <div><div style="font-size: 22px; font-weight: 300;">۴۸</div>
      <div style="margin-top: 3px; font-size: 10.5px; color: rgba(16,32,43,.45);">گفتگو</div></div>
    <div><div style="font-size: 22px; font-weight: 300;">۴٫۸</div>
      <div style="margin-top: 3px; font-size: 10.5px; color: rgba(16,32,43,.45);">امتیاز</div></div>
    <div><div style="font-size: 22px; font-weight: 300;">۹۴٪</div>
      <div style="margin-top: 3px; font-size: 10.5px; color: rgba(16,32,43,.45);">پاسخ‌دهی</div></div>
  </div>

  <div style="position: absolute; top: 456px; right: 26px; left: 26px; font-size: 14px; line-height: 2;
              color: rgba(16,32,43,.7);">
    سه سال است شب‌ها بیدارم. بیشتر آدم‌ها دنبال نصیحت نیستند؛ دنبال کسی‌اند که وسط حرفشان نپرد.
  </div>

  <!-- Content: bought pieces are near and sharp, locked ones sit further back
       and blurred. The blur IS the lock - no padlock icon anywhere, and the
       user still cannot read what they have not paid for. -->
  <div style="position: absolute; top: 566px; right: 26px; left: 26px;">
    <div style="font-size: 11px; letter-spacing: .16em; color: rgba(16,32,43,.38);">از او</div>
    <div style="margin-top: 14px; display: flex; gap: 12px; align-items: flex-end;">
      <div style="width: 104px; height: 128px; border-radius: 20px;
                  background: linear-gradient(155deg,#8aa3b2,#4e6a7c);
                  box-shadow: 0 16px 34px rgba(16,32,43,.22);"></div>
      <div style="width: 86px; height: 106px; border-radius: 18px; filter: blur(4px); opacity: .72;
                  background: linear-gradient(155deg,#a89a94,#6f5f5a);"></div>
      <div style="width: 70px; height: 86px; border-radius: 16px; filter: blur(6px); opacity: .55;
                  background: linear-gradient(155deg,#9aa9a3,#61716c);"></div>
    </div>
    <div style="margin-top: 10px; display: flex; gap: 12px; font-size: 10.5px; color: rgba(16,32,43,.45);">
      <div style="width: 104px;">باز</div>
      <div style="width: 86px;">۲۰ دراپ</div>
      <div style="width: 70px;">۱۵ دراپ</div>
    </div>
  </div>

  <!-- The offer and the action occupy the nearest plane, one above the other,
       both inside the thumb arc. -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 92px; border-radius: 26px;
              background: rgba(255,255,255,.62); backdrop-filter: blur(14px); padding: 16px 20px;
              box-shadow: 0 14px 40px rgba(16,32,43,.16);">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 14.5px;">گفتگوی شبانه · ۳۰ دقیقه</div>
      <div style="font-size: 16px; color: #d4573c;">۱۰۰</div>
    </div>
    <div style="margin-top: 8px; font-size: 11px; color: rgba(16,32,43,.48);">چهار بخش ۷٫۵ دقیقه‌ای</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; min-height: 56px; border-radius: 28px;
              background: #10202b; color: #eef3f6; display: flex; align-items: center; justify-content: center;
              font-size: 15px; box-shadow: 0 18px 44px rgba(16,32,43,.32);">درخواست گفتگو</div>

</div>
</x-dc>
</body>
</html>
