<title>جهانِ ساده</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600&family=Sora:wght@300;400&display=swap">
<style>
/* Cosmos, simplified — a prototype. The idea: the world stays as beautiful
   as it was, but every way of getting around is one plain tap. The only
   gesture is dragging the sky. One deliberate look (the night sky of the
   project's visual language); no light variant, by choice. */
:root {
  color-scheme: dark;
  --ink: #04080a;
  --fg: #e9f2f0;
  --fg-soft: rgba(233, 242, 240, .66);
  --fg-faint: rgba(233, 242, 240, .4);
  --warm: #f2b06a;
  --warm-bright: #f6be82;
  --cool: #7ad7c8;
  --live: #8ce0a4;
  --talk: #b69cff;
  --news: #ff4d7d;
  --echo: #6fa8ff;
  --event: #ffcf5a;
  --line: rgba(233, 242, 240, .1);
  --fa: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --en: 'Sora', 'Vazirmatn', system-ui, sans-serif;
  --settle: cubic-bezier(.2, .9, .25, 1.04);
}
html, body { height: 100%; }
body { margin: 0; background: #020405; color: var(--fg); font-family: var(--fa); font-weight: 300; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.phone { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
@media (min-width: 560px) { .phone { width: 410px; height: min(100%, 880px); border-radius: 34px; box-shadow: 0 0 0 1px rgba(122, 215, 200, .12), 0 40px 120px rgba(0, 0, 0, .7); } }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--warm-bright); outline-offset: 2px; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- the world ---------- */
.world { position: absolute; inset: 0; touch-action: none; cursor: grab; }
.cam { position: absolute; left: 50%; top: 44%; width: 0; height: 0; will-change: transform; }
.orbit { position: absolute; border-radius: 50%; border: 1px solid rgba(122, 215, 200, .1); transform: translate(-50%, -50%); pointer-events: none; }
.p { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
.orb { position: relative; width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--s) * .38); font-weight: 200; color: #f5fbf9; background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .34), transparent 56%), linear-gradient(145deg, var(--a), var(--b)); box-shadow: 0 10px 26px rgba(0, 0, 0, .5), inset -6px -8px 16px rgba(0, 0, 0, .42), 0 0 calc(var(--g) * 30px) rgba(122, 215, 200, calc(var(--g) * .6)); animation: drift var(--d) ease-in-out infinite; animation-delay: var(--dl); transition: transform .4s var(--settle); }
.p:hover .orb { transform: scale(1.08); }
.live { position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid rgba(140, 224, 164, .6); }
.p .nm { font-size: 11px; color: var(--fg-soft); white-space: nowrap; }
@keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 3px -4px; } }

.head { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 0; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
.head b { font-family: var(--en); font-weight: 300; font-size: 17px; letter-spacing: .02em; }
.head span { font-size: 12px; color: var(--fg-faint); }
.head .here { color: var(--live); }

/* A person, held: a sheet from the bottom with the two things to do. */
.sheet-veil { position: absolute; inset: 0; z-index: 30; background: rgba(2, 5, 6, .5); animation: fade .25s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; padding: 12px 20px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0; background: linear-gradient(to bottom, #0f2227, #081316); border-top: 1px solid rgba(122, 215, 200, .2); display: flex; flex-direction: column; align-items: center; gap: 10px; animation: up .38s var(--settle); }
.grab { width: 38px; height: 4px; border-radius: 2px; background: rgba(233, 242, 240, .2); }
.sheet .orb { --s: 76px; animation: none; }
.sheet h2 { margin: 0; font-weight: 400; font-size: 20px; }
.sheet .line { margin: 0; font-size: 13px; line-height: 1.9; color: var(--fg-soft); text-align: center; max-width: 30ch; }
.tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.tag { padding: 3px 10px; border-radius: 12px; font-size: 11px; color: var(--cool); background: rgba(122, 215, 200, .1); }
.flag { font-size: 11px; color: var(--live); }
.btn { width: 100%; min-height: 52px; border-radius: 22px; border: 1px solid rgba(158, 226, 214, .26); background: rgba(14, 32, 37, .6); font-size: 14px; cursor: pointer; }
.btn.warm { border: 0; font-weight: 500; font-size: 15px; color: #2b1704; background: linear-gradient(160deg, #ffdda6, #f9b45f 46%, #eb9433); box-shadow: 0 0 30px rgba(255, 178, 100, .35); }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* ---------- the bar: five plain doors, Sol in the middle ---------- */
.bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: linear-gradient(to top, rgba(4, 9, 12, .96) 60%, rgba(4, 9, 12, 0)); }
.door { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; padding-top: 6px; border: 0; background: none; color: var(--fg-faint); font-size: 11px; cursor: pointer; transition: color .2s ease; }
.door svg { width: 24px; height: 24px; }
.door[aria-current="page"] { color: var(--c); }
.door[aria-current="page"]::before { content: ''; position: absolute; top: -2px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle, var(--c), transparent 70%); opacity: .25; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--news); color: #fff; font-size: 10px; font-weight: 500; display: grid; place-items: center; }
.sol-door { align-self: center; justify-self: center; width: 58px; height: 58px; margin-bottom: 6px; border: 0; border-radius: 50%; cursor: pointer; background: radial-gradient(circle at 43% 37%, #fff 0%, #fffdf6 9%, #ffe9b4 26%, #ffc258 48%, #ff9a1f 70%, #e9700c 88%, #bf5405 100%); box-shadow: 0 0 0 1px rgba(255, 248, 232, .9), 0 0 20px rgba(255, 214, 158, .9), 0 0 48px rgba(255, 172, 78, .5); transition: scale .2s ease; }
.sol-door:active { scale: .92; }

/* ---------- places ---------- */
.place { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top, 0px)) 0 calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--bg); animation: place-in .35s var(--settle); }
@keyframes place-in { from { opacity: 0; transform: translateY(14px); } }
.place-head { padding: 0 20px 12px; display: flex; flex-direction: column; gap: 3px; }
.place-head b { font-weight: 400; font-size: 20px; }
.place-head span { font-size: 12px; color: var(--fg-faint); }
.scroll { flex: 1; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }

/* conversations */
.p-talk { --bg: radial-gradient(120% 80% at 50% 0%, #1c1036, #0a0718 60%); }
.row { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 8px 12px; border: 0; border-radius: 18px; background: rgba(182, 156, 255, .07); text-align: start; cursor: pointer; }
.row:active { background: rgba(182, 156, 255, .14); }
.row .orb { --s: 48px; animation: none; flex: none; }
.row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .tx b { font-weight: 400; font-size: 14px; }
.row .tx span { font-size: 12px; color: rgba(214, 200, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 10px; color: var(--fg-faint); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 500; color: #140a2a; background: #8fe8ff; }
.from { font-size: 10px; color: var(--echo); }

/* chat */
.p-chat { --bg: linear-gradient(to bottom, #130d28, #09081a); padding-bottom: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 0 16px 12px; border-bottom: 1px solid rgba(182, 156, 255, .14); }
.back { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(233, 242, 240, .06); display: grid; place-items: center; cursor: pointer; }
.chat-head .orb { --s: 42px; animation: none; }
.chat-head .who b { display: block; font-weight: 400; font-size: 16px; }
.chat-head .who span { font-size: 11px; color: var(--fg-faint); }
.msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.bub { max-width: 78%; padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.8; animation: fade .25s ease; }
.bub.them { align-self: flex-start; background: rgba(182, 156, 255, .14); }
.bub.me { align-self: flex-end; background: rgba(242, 176, 106, .16); }
.note { align-self: center; font-size: 11px; color: var(--fg-faint); padding: 3px 12px; border-radius: 12px; background: rgba(233, 242, 240, .05); }
.typing { align-self: flex-start; font-size: 12px; color: var(--fg-faint); }
.compose { display: flex; gap: 8px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(182, 156, 255, .1); }
.compose input { flex: 1; min-height: 46px; padding: 0 16px; border-radius: 23px; border: 1px solid rgba(233, 242, 240, .12); background: rgba(233, 242, 240, .05); color: var(--fg); font: inherit; font-size: 14px; }
.send { width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--warm); color: #2b1704; display: grid; place-items: center; cursor: pointer; }

/* Echo */
.p-echo { --bg: radial-gradient(120% 70% at 50% 35%, #0e1f48, #030714 70%); }
.echo-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 24px; text-align: center; }
.lights { position: relative; width: 180px; height: 120px; }
.lights i { position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--echo); box-shadow: 0 0 20px var(--echo); }
.lights .a { left: 20px; animation: seek-a 3.2s ease-in-out infinite; }
.lights .b { right: 20px; animation: seek-b 3.2s ease-in-out infinite; }
.searching .lights .a { animation-duration: 1s; }
.searching .lights .b { animation-duration: 1s; }
@keyframes seek-a { 50% { transform: translate(55px, -18px); } }
@keyframes seek-b { 50% { transform: translate(-55px, 18px); } }
.echo-stage h3 { margin: 0; font-weight: 300; font-size: 22px; }
.echo-stage p { margin: 0; font-size: 13px; line-height: 1.9; color: var(--fg-soft); max-width: 30ch; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid rgba(111, 168, 255, .3); background: rgba(20, 40, 90, .45); color: var(--fg-soft); font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: rgba(111, 168, 255, .3); color: var(--fg); border-color: rgba(111, 168, 255, .7); }
.echo-go { width: min(300px, 100%); min-height: 56px; border: 0; border-radius: 28px; font-size: 15px; font-weight: 500; color: #04122e; background: linear-gradient(160deg, #cfe2ff, #7fb0ff 50%, #4f86e8); box-shadow: 0 0 34px rgba(111, 168, 255, .45); cursor: pointer; }
.echo-go[disabled] { opacity: .6; }
.small { font-size: 11px; color: var(--fg-faint); }

/* events */
.p-events { --bg: radial-gradient(120% 70% at 50% 0%, #2a2008, #0c0903 65%); }
.event { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: rgba(255, 207, 90, .06); border: 1px solid rgba(255, 207, 90, .18); }
.event.now { border-color: rgba(255, 207, 90, .55); box-shadow: 0 0 24px rgba(255, 207, 90, .12); }
.ev-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ev-top b { font-weight: 400; font-size: 15px; }
.ev-when { font-size: 11px; color: var(--event); white-space: nowrap; font-variant-numeric: tabular-nums; }
.event p { margin: 0; font-size: 12px; line-height: 1.8; color: var(--fg-soft); }
.ev-meta { display: flex; gap: 12px; font-size: 11px; color: var(--fg-faint); }
.ev-go { align-self: flex-start; min-height: 42px; padding: 0 18px; border: 0; border-radius: 21px; background: var(--event); color: #2b1e02; font-size: 13px; font-weight: 500; cursor: pointer; }
.ev-go.joined { background: transparent; border: 1px solid rgba(255, 207, 90, .5); color: var(--event); }
.teams { display: flex; gap: 6px; }
.teams span { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 207, 90, .15); overflow: hidden; }
.teams span i { display: block; height: 100%; background: var(--event); }

/* me */
.p-me { --bg: radial-gradient(120% 70% at 50% 20%, #33200a, #0d0803 65%); }
.me-top { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 20px 18px; }
.me-top .orb { --s: 96px; animation: none; }
.me-top h2 { margin: 0; font-weight: 400; font-size: 20px; }
.me-top .un { font-family: var(--en); font-size: 12px; color: var(--fg-faint); direction: ltr; unicode-bidi: isolate; }
.me-top .line { margin: 0; font-size: 13px; color: var(--fg-soft); text-align: center; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 14px; border: 0; border-radius: 16px; background: rgba(242, 176, 106, .06); text-align: start; font-size: 14px; cursor: pointer; }
.set span { font-size: 12px; color: var(--fg-faint); }

.toast { position: absolute; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); z-index: 60; transform: translateX(-50%); max-width: calc(100% - 40px); padding: 9px 16px; border-radius: 18px; font-size: 12px; line-height: 1.7; text-align: center; background: rgba(14, 32, 37, .95); border: 1px solid rgba(233, 242, 240, .12); animation: fade .25s ease; }
.hint { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 6; transform: translateX(-50%); padding: 7px 14px; border-radius: 16px; font-size: 12px; background: rgba(14, 32, 37, .8); border: 1px solid var(--line); white-space: nowrap; pointer-events: none; transition: opacity .5s ease; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; } }
</style>

<div class="phone" id="stage" dir="rtl" lang="fa">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="world" id="world"><div class="cam" id="cam"></div></div>
  <header class="head"><b>Vega Galaxy</b><span id="head-sub"></span></header>
  <div class="hint" id="hint">جهان را بکش و روی هر کسی بزن</div>
  <div id="place"></div>
  <div id="sheet"></div>
  <nav class="bar" id="bar" aria-label="جاها">
    <button class="door" type="button" data-go="talk" style="--c: var(--talk)" aria-label="گفتگوها"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.5 6.6L4 20l1.3-3.6A8 8 0 0 1 4 12z"/></svg>گفتگوها<span class="badge" id="talk-badge">۲</span></button>
    <button class="door" type="button" data-go="echo" style="--c: var(--echo)" aria-label="Echo"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="10" r="3"/></svg>اکو</button>
    <button class="sol-door" type="button" data-go="world" aria-label="جهان"></button>
    <button class="door" type="button" data-go="events" style="--c: var(--event)" aria-label="رویدادها"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>رویدادها</button>
    <button class="door" type="button" data-go="me" style="--c: var(--warm)" aria-label="من"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>من</button>
  </nav>
  <div id="toast-slot" aria-live="polite"></div>
</div>

<script>
/* Example people only; nobody here is real. */
const $ = (s) => document.querySelector(s);
const fa = (n) => Number(n).toLocaleString('fa');
const stage = $('#stage');
function toast(t, ms = 2600) { $('#toast-slot').innerHTML = `<div class="toast">${t}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => { $('#toast-slot').innerHTML = ''; }, ms); }

const NAMES = ['نگار', 'هومن', 'شبنم', 'آرش', 'مهتاب', 'کیان', 'بهار', 'سامان', 'ترانه', 'نوید', 'دریا', 'فرهاد', 'زاله', 'کسری', 'سوگند', 'پویا', 'الهام', 'رها', 'بردیا', 'نیلوفر', 'امید', 'ستاره', 'آیدین', 'مینا'];
const LINES = ['شب‌ها بیدارم و وسطِ حرفِ کسی نمی‌پرم.', 'دنبالِ کسی‌ام که جاز گوش بده.', 'کتاب زیاد می‌خونم، کم حرف می‌زنم.', 'کوه، قهوه، و آدم‌هایی که حوصله دارن.', 'فقط گوش می‌دم، اگه لازم شد حرف می‌زنم.', 'زبان یاد می‌گیرم تا با آدمای بیشتری حرف بزنم.', 'عکاسیِ شب، و حرف‌های نصفه‌کاره.', 'گربه دارم و ازش زیاد تعریف می‌کنم.'];
const TAGS = ['کتاب', 'موسیقی', 'فیلم', 'کوه', 'عکاسی', 'زبان', 'بازی', 'قهوه'];
const BODIES = [['#3e8f86', '#1c3f52'], ['#8a4f7d', '#2d1a3c'], ['#a8753a', '#3d2410'], ['#4f6fa8', '#1a2540'], ['#6f8f3e', '#243312'], ['#a84f4f', '#3c1a1a'], ['#6a5acd', '#221a4a']];
const people = NAMES.map((n, i) => {
  const a = i * 2.39996, r = 70 + Math.sqrt(i) * 78;
  return { i, name: n, line: LINES[i % LINES.length], tags: [TAGS[i % 8], TAGS[(i * 3 + 1) % 8]], x: Math.cos(a) * r, y: Math.sin(a) * r, s: 40 + ((i * 37) % 30), g: ((i * 53) % 10) / 10, online: i % 3 === 0, body: BODIES[i % BODIES.length] };
});
const orbHTML = (p, extra = '') => `<span class="orb" style="--a:${p.body[0]};--b:${p.body[1]};--s:${p.s}px;--g:${p.g};--d:${10 + (p.i % 7)}s;--dl:${-p.i}s" ${extra}>${p.name[0]}${p.online ? '<span class="live"></span>' : ''}</span>`;

// ---------------------------------------------------------------- world
const cam = $('#cam');
[180, 330, 480].forEach((d) => { const o = document.createElement('div'); o.className = 'orbit'; o.style.width = o.style.height = `${d}px`; cam.appendChild(o); });
people.forEach((p) => {
  const el = document.createElement('div');
  el.className = 'p'; el.style.left = `${p.x}px`; el.style.top = `${p.y}px`;
  el.innerHTML = `${orbHTML(p)}<span class="nm">${p.name}</span>`;
  el.dataset.i = p.i;
  cam.appendChild(el);
});
$('#head-sub').innerHTML = `${fa(people.length)} نفر در این کهکشان · <span class="here">${fa(people.filter((p) => p.online).length)} نفر همین حالا</span>`;
let camX = 0, camY = 0, drag = null;
const world = $('#world');
const place = () => { cam.style.transform = `translate3d(${-camX}px, ${-camY}px, 0)`; };
world.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx: camX, cy: camY, moved: false }; world.setPointerCapture(e.pointerId); });
world.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true;
  camX = drag.cx - dx; camY = drag.cy - dy; place();
});
world.addEventListener('pointerup', (e) => {
  const d = drag; drag = null;
  if (!d || d.moved) { $('#hint').style.opacity = '0'; return; }
  const el = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.classList && x.classList.contains('p'));
  if (el) openPerson(people[Number(el.dataset.i)]);
});
place();

// A person: a sheet with who they are and the two things to do.
function openPerson(p) {
  $('#hint').style.opacity = '0';
  $('#sheet').innerHTML = `<div class="sheet-veil" id="veil"></div>
    <div class="sheet" role="dialog" aria-label="${p.name}"><span class="grab"></span>${orbHTML(p)}<h2>${p.name}</h2>
      ${p.online ? '<span class="flag">همین حالا اینجاست</span>' : ''}
      <p class="line">${p.line}</p><div class="tags">${p.tags.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
      <button class="btn warm" type="button" id="hello">سلام کن</button>
      <button class="btn" type="button" id="profile">دیدنِ پروفایل</button></div>`;
  $('#veil').onclick = closeSheet;
  $('#hello').onclick = () => { closeSheet(); openChat(p, 'world'); };
  $('#profile').onclick = () => toast('پروفایلِ کامل: عکس‌ها، علاقه‌ها و چیزهایی که گذاشته.');
}
function closeSheet() { $('#sheet').innerHTML = ''; }

// ---------------------------------------------------------------- places
const CONVOS = [
  { p: people[1], last: 'اون آلبومی که گفتی رو گوش دادم', when: 'همین حالا', unread: 1, from: 'world' },
  { p: people[4], last: 'فردا شب هم Echo میای؟', when: '۲۰ دقیقه', unread: 1, from: 'echo' },
  { p: people[9], last: 'خیلی خوب بود حرف زدن باهات', when: 'دیروز', unread: 0, from: 'event' },
  { p: people[6], last: 'عکسشو برات می‌فرستم', when: '۳ روز', unread: 0, from: 'world' },
];
const FROM = { world: 'از جهان', echo: 'از Echo', event: 'از رویداد' };
const EVENTS = [
  { now: true, t: 'شبِ Echo · کتاب', when: 'همین حالا · ۲۲ دقیقه مانده', d: 'نیم‌ساعت گفتگو با آدم‌های تازه دربارهٔ آخرین کتابی که خواندی.', meta: ['۱۴ نفر داخل‌اند', 'دونفره'] },
  { t: 'مسابقهٔ حدسِ فیلم', when: 'امشب ۲۲:۳۰', d: 'تیم‌های چهارنفره با غریبه‌ها. یک دیالوگ می‌آید، تیمت باید زودتر فیلم را حدس بزند.', meta: ['۳ تیم کامل', 'گروهی'], teams: [100, 100, 75, 25] },
  { t: 'شبِ Echo · موسیقی', when: 'فردا ۲۱:۰۰', d: 'یک آهنگ که این هفته زیاد گوش دادی را با یک آدمِ تازه به اشتراک بگذار.', meta: ['۹ نفر ثبت‌نام کرده‌اند', 'دونفره'] },
  { t: 'چالشِ عکسِ آسمان', when: 'جمعه تا یکشنبه', d: 'یک عکس از آسمانِ شهرت بگذار؛ جهان رأی می‌دهد.', meta: ['۴۱ عکس', 'همه'] },
];
let current = 'world';
function go(to) {
  current = to;
  closeSheet();
  document.querySelectorAll('.door').forEach((d) => d.setAttribute('aria-current', d.dataset.go === to ? 'page' : 'false'));
  const host = $('#place');
  if (to === 'world') { host.innerHTML = ''; return; }
  if (to === 'talk') {
    host.innerHTML = `<section class="place p-talk"><div class="place-head"><b>گفتگوها</b><span>${fa(CONVOS.length)} گفتگو · ${fa(CONVOS.filter((c) => c.unread).length)} تا با پیامِ تازه</span></div>
      <div class="scroll">${CONVOS.map((c, k) => `<button class="row" type="button" data-k="${k}">${orbHTML(c.p)}<span class="tx"><b>${c.p.name}</b><span>${c.last}</span><span class="from">${FROM[c.from]}</span></span><span class="meta">${c.when}${c.unread ? `<span class="count">${fa(c.unread)}</span>` : ''}</span></button>`).join('')}</div></section>`;
    host.querySelectorAll('.row').forEach((r) => { r.onclick = () => { const c = CONVOS[Number(r.dataset.k)]; c.unread = 0; updateBadge(); openChat(c.p, c.from, c.last); }; });
  }
  if (to === 'echo') drawEcho();
  if (to === 'events') drawEvents();
  if (to === 'me') {
    const me = { i: 99, name: 'مهسا', s: 96, g: .7, online: true, body: ['#3e8f86', '#1c3f52'] };
    host.innerHTML = `<section class="place p-me"><div class="me-top">${orbHTML(me)}<h2>مهسا</h2><span class="un">@mahsa.sky</span><p class="line">آدمِ حرف‌های نصفه‌کاره‌ام؛ عصرها کتاب، شب‌ها آسمان.</p><div class="tags"><span class="tag">کتاب</span><span class="tag">عکاسی</span><span class="tag">موسیقی</span></div></div>
      <div class="scroll">${[['ویرایشِ پروفایل', 'نام، عکس، جمله، علاقه‌ها'], ['حریمِ خصوصی', 'چه کسی چه چیزی از تو می‌بیند، مسدودها'], ['اعلان‌ها', 'وقتی کسی جواب داد یا رویدادی شروع شد'], ['تنظیمات', 'زبان، ظاهرِ سبک'], ['خروج', '']].map(([a, b]) => `<button class="set" type="button">${a}<span>${b}</span></button>`).join('')}</div></section>`;
    host.querySelectorAll('.set').forEach((s) => { s.onclick = () => toast('یک صفحهٔ ساده و آشنا — بدون هیچ چیزی که لازم باشد یاد بگیری.'); });
  }
}
function updateBadge() { const n = CONVOS.filter((c) => c.unread).length; const b = $('#talk-badge'); b.textContent = fa(n); b.hidden = !n; }
document.querySelectorAll('[data-go]').forEach((b) => { b.onclick = () => go(b.dataset.go); });

// Echo: one big button; interests are optional.
const picked = new Set();
function drawEcho(state = 'idle', found) {
  const host = $('#place');
  const body = {
    idle: `<h3>یک آدمِ تازه</h3><p>با یک ضربه به کسی وصل می‌شوی که هنوز نمی‌شناسی. اگر بخواهی، یکی دو علاقه انتخاب کن.</p>
      <div class="chips">${TAGS.map((t) => `<button class="chip" type="button" aria-pressed="${picked.has(t)}" data-t="${t}">${t}</button>`).join('')}</div>
      <button class="echo-go" type="button" id="echo-go">${picked.size ? 'پیدا کن، با این علاقه‌ها' : 'پیدا کن'}</button><span class="small">${fa(people.filter((p) => p.online).length)} نفر همین حالا در دسترس‌اند</span>`,
    searching: `<h3>دنبالِ یک آدمِ تازه…</h3><p>${picked.size ? `با علاقهٔ ${[...picked].join(' و ')}` : 'هر کسی که آماده است'}</p><button class="echo-go" type="button" disabled>در حالِ جستجو</button>`,
    found: found ? `<h3>${found.name} پیدا شد</h3><p>«${found.line}»</p><button class="echo-go" type="button" id="echo-talk">شروعِ گفتگو</button>` : '',
  }[state];
  host.innerHTML = `<section class="place p-echo ${state === 'searching' ? 'searching' : ''}"><div class="place-head"><b>اکو</b><span>آشنایی با آدم‌های تازه</span></div><div class="echo-stage"><div class="lights" aria-hidden="true"><i class="a"></i><i class="b"></i></div>${body}</div></section>`;
  host.querySelectorAll('.chip').forEach((c) => { c.onclick = () => { const t = c.dataset.t; if (picked.has(t)) picked.delete(t); else if (picked.size < 3) picked.add(t); drawEcho(); }; });
  const goBtn = $('#echo-go');
  if (goBtn) goBtn.onclick = () => {
    drawEcho('searching');
    setTimeout(() => { const pool = people.filter((p) => p.online && !CONVOS.some((c) => c.p === p)); drawEcho('found', pool[Math.floor(Math.random() * pool.length)] || people[12]); }, 2200);
  };
  const talk = $('#echo-talk');
  if (talk) talk.onclick = () => openChat(found, 'echo');
}

function drawEvents() {
  const host = $('#place');
  host.innerHTML = `<section class="place p-events"><div class="place-head"><b>رویدادها</b><span>با غریبه‌ها، در یک ساعتِ مشخص</span></div><div class="scroll">${EVENTS.map((e, k) => `
    <div class="event${e.now ? ' now' : ''}"><div class="ev-top"><b>${e.t}</b><span class="ev-when">${e.when}</span></div><p>${e.d}</p>
      ${e.teams ? `<div class="teams" aria-label="تیم‌ها">${e.teams.map((v) => `<span><i style="width:${v}%"></i></span>`).join('')}</div>` : ''}
      <div class="ev-meta">${e.meta.map((m) => `<span>${m}</span>`).join('')}</div>
      <button class="ev-go${e.joined ? ' joined' : ''}" type="button" data-k="${k}">${e.now ? 'ورود' : e.joined ? 'ثبت‌نام کردی ✓' : 'یادم بینداز'}</button></div>`).join('')}</div></section>`;
  host.querySelectorAll('.ev-go').forEach((b) => { b.onclick = () => {
    const e = EVENTS[Number(b.dataset.k)];
    if (e.now) { openChat(people[15], 'event'); return; }
    e.joined = !e.joined; drawEvents(); if (e.joined) toast('وقتی شروع شد خبرت می‌کنیم.');
  }; });
}

// A conversation: the ordinary kind, on purpose.
const REPLIES = ['سلام! چه خوب که پیدات کردم 🙂', 'منم همینو دوست دارم، تو از کجا شروع کردی؟', 'جدی؟ باید بیشتر تعریف کنی', 'دو دقیقه دیگه برمی‌گردم'];
function openChat(p, from, last) {
  const host = $('#place');
  host.innerHTML = `<section class="place p-chat"><div class="chat-head"><button class="back" type="button" id="back" aria-label="برگشت"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>${orbHTML(p)}<span class="who"><b>${p.name}</b><span>${p.online ? 'همین حالا اینجاست' : 'چند ساعت پیش اینجا بود'}</span></span></div>
    <div class="msgs" id="msgs"><span class="note">${FROM[from] || 'از جهان'}</span>${last ? `<div class="bub them">${last}</div>` : ''}</div>
    <form class="compose" id="compose"><input id="msg" type="text" placeholder="چیزی بنویس…" autocomplete="off" aria-label="پیام"><button class="send" type="submit" aria-label="فرستادن"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z" transform="scale(-1,1) translate(-24,0)"/></svg></button></form></section>`;
  $('#back').onclick = () => go(current === 'world' ? 'world' : current);
  let k = 0;
  $('#compose').onsubmit = (e) => {
    e.preventDefault();
    const v = $('#msg').value.trim(); if (!v) return;
    const m = $('#msgs');
    m.insertAdjacentHTML('beforeend', `<div class="bub me">${v.replace(/</g, '&lt;')}</div>`);
    $('#msg').value = '';
    m.insertAdjacentHTML('beforeend', '<span class="typing" id="typing">در حالِ نوشتن…</span>');
    m.scrollTop = m.scrollHeight;
    setTimeout(() => { $('#typing')?.remove(); m.insertAdjacentHTML('beforeend', `<div class="bub them">${REPLIES[k++ % REPLIES.length]}</div>`); m.scrollTop = m.scrollHeight; }, 1300);
  };
  if (!CONVOS.some((c) => c.p === p)) CONVOS.unshift({ p, last: 'تازه آشنا شدید', when: 'همین حالا', unread: 0, from });
}

// ------------------------------------------------------------------ sky
const sky = $('#sky'), ctx = sky.getContext('2d');
const stars = Array.from({ length: 200 }, () => ({ x: Math.random(), y: Math.random(), z: .2 + Math.random() * .8, r: Math.random() < .08 ? 1.4 : .4 + Math.random() * .8, tw: Math.random() * 6.3 }));
let W = 0, H = 0;
function resize() { const b = stage.getBoundingClientRect(); W = b.width; H = b.height; const d = Math.min(devicePixelRatio || 1, 2); sky.width = W * d; sky.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
function frame(t) {
  ctx.fillStyle = '#05100f'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, Math.max(W, H) * .8);
  g.addColorStop(0, 'rgba(14,32,37,1)'); g.addColorStop(1, 'rgba(14,32,37,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    let x = (s.x * W - camX * s.z * .25) % W; if (x < 0) x += W;
    let y = (s.y * H - camY * s.z * .25) % H; if (y < 0) y += H;
    ctx.globalAlpha = (.3 + s.z * .6) * (.55 + .45 * Math.sin(t * .0012 + s.tw));
    ctx.fillStyle = '#dcecea'; ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1; requestAnimationFrame(frame);
}
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
go('world');
</script>
