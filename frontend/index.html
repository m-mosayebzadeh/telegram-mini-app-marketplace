<!doctype html>
<!-- lang="fa" dir="rtl" matches i18n/config.ts's default language (Persian)
     — setting the correct value here, before any JS runs, avoids a flash
     of left-to-right layout on first paint. src/i18n/config.ts keeps this
     attribute in sync afterward if the user switches to English. -->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <!-- Fonts are served from our own origin, not from Google.
         fonts.gstatic.com is not reliably reachable from Iran, and a
         typeface that sometimes fails to arrive is a design that
         sometimes does not happen. They were vendored with the world
         prototype (TECHNICAL_REQUIREMENTS.md section 23.2) and this is
         the same set.

         Blocking is fine here precisely because it is same-origin and
         already cached with the app — the reason the old Google link had
         to be async was that its wait had no upper bound. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
