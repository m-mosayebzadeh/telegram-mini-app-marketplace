<!doctype html>
<!-- lang="fa" dir="rtl" matches i18n/config.ts's default language (Persian)
     — setting the correct value here, before any JS runs, avoids a flash
     of left-to-right layout on first paint. src/i18n/config.ts keeps this
     attribute in sync afterward if the user switches to English. -->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <!-- Vazirmatn (Persian + Latin) and Inter (Latin) — see
         docs/MODERN_DESIGN_SPECIFICATION.md's Typography section:
         Inter for English text, Vazirmatn for Persian text and as
         Inter's fallback for any Latin glyph Inter doesn't cover, so
         fa/en text mixed in the same string (a name, a username) still
         renders from one coherent, deliberately-picked stack instead of
         silently falling back to the OS's default system font.

         Loaded asynchronously (preload + swap-on-load, not a plain
         blocking <link rel="stylesheet">) — a normal blocking stylesheet
         link makes the whole page wait on this one external request
         before it can render at all, and on a slow or restricted
         network (a Telegram WebView with a flaky connection, a
         corporate proxy, this being unreachable at all) that wait has
         no upper bound. theme.css's font-family stacks already fall
         back to system-ui, so there's nothing lost by letting the page
         paint immediately in the fallback and upgrade whenever/if this
         finishes loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
