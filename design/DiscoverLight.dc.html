<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #e4552a; } a:hover { color: #c9441d; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #fffcfb; color: #191211; font-family: Vazirmatn, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- header -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 12px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px;">ویترین</span>
      <span style="font-size: 13px; font-weight: 500; color: #9a8983;">۲۴ نفر آنلاین</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: #f8f2ef; border: 1px solid #e9ded9;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e4552a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8C12 2.8 5.9 9.6 5.9 14a6.1 6.1 0 0 0 12.2 0c0-4.4-6.1-11.2-6.1-11.2Z"/></svg>
      <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">۴۸۰</span>
    </div>
  </div>

  <!-- filters -->
  <div style="display: flex; gap: 8px; padding: 0 20px 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #e4552a; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap;">همه</div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #f8f2ef; border: 1px solid #e9ded9; color: #6b5c57; font-size: 13px; font-weight: 600; white-space: nowrap;">محبوب</div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #f8f2ef; border: 1px solid #e9ded9; color: #6b5c57; font-size: 13px; font-weight: 600; white-space: nowrap;">کمتر از ۱۰۰</div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 999px; background: #f8f2ef; border: 1px solid #e9ded9; color: #6b5c57; font-size: 13px; font-weight: 600; white-space: nowrap;">سریع</div>
  </div>

  <!-- feed -->
  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 0 20px;">

    <!-- card 1 -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="position: relative; height: 290px; border-radius: 16px; overflow: hidden; background: linear-gradient(155deg, #5a2f25 0%, #8a4436 45%, #3b2420 100%);">
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,7,7,0.92) 0%, rgba(10,7,7,0.35) 38%, rgba(10,7,7,0) 62%);"></div>
        <div style="position: absolute; inset-inline-start: 12px; top: 12px; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 999px; background: rgba(10,7,7,0.6); backdrop-filter: blur(8px);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#e4552a"><path d="M12 2.8C12 2.8 5.9 9.6 5.9 14a6.1 6.1 0 0 0 12.2 0c0-4.4-6.1-11.2-6.1-11.2Z"/></svg>
          <span style="font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums;">۱۰۰</span>
        </div>
        <div style="position: absolute; inset-inline: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 20px; font-weight: 700; color: #fff;">سارا</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e4552a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-10"/></svg>
            </div>
            <span style="font-size: 14px; color: rgba(255,255,255,0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">شب‌ها بیدارم، حرف بزنیم</span>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.72); white-space: nowrap;">۲۰ دقیقه</span>
        </div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="padding: 6px 12px; border-radius: 8px; background: #f8f2ef; color: #6b5c57; font-size: 12px; font-weight: 500;">موسیقی</div>
        <div style="padding: 6px 12px; border-radius: 8px; background: #f8f2ef; color: #6b5c57; font-size: 12px; font-weight: 500;">سفر</div>
        <div style="padding: 6px 12px; border-radius: 8px; background: #f8f2ef; color: #6b5c57; font-size: 12px; font-weight: 500;">فیلم</div>
      </div>
    </div>

    <!-- card 2 (peeking) -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="position: relative; height: 290px; border-radius: 16px; overflow: hidden; background: linear-gradient(155deg, #3f3326 0%, #7a5f3a 45%, #2b241c 100%);">
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,7,7,0.92) 0%, rgba(10,7,7,0.35) 38%, rgba(10,7,7,0) 62%);"></div>
        <div style="position: absolute; inset-inline-start: 12px; top: 12px; display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 999px; background: rgba(10,7,7,0.6);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#e4552a"><path d="M12 2.8C12 2.8 5.9 9.6 5.9 14a6.1 6.1 0 0 0 12.2 0c0-4.4-6.1-11.2-6.1-11.2Z"/></svg>
          <span style="font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums;">۵۰</span>
        </div>
        <div style="position: absolute; inset-inline: 16px; bottom: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 20px; font-weight: 700; color: #fff;">نیلوفر</span>
            <span style="font-size: 14px; color: rgba(255,255,255,0.72);">هرچی بخوای گوش می‌دم</span>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.72); white-space: nowrap;">۱۵ دقیقه</span>
        </div>
      </div>
    </div>

  </div>

  <!-- bottom nav -->
  <div style="display: flex; align-items: stretch; padding: 8px 12px 22px; background: #fffcfb; border-top: 1px solid #eee5e1;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; min-height: 44px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e4552a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #e4552a;">ویترین</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a8983" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c2.3-3.3.2-7.8-1-8.9 0 3.4-2.2 5.3-3.7 6.7S5 12.1 5 14.4c0 3.7 3.1 6.7 7 6.7s7-3 7-6.7c0-1.7-1.2-4.4-2.3-5.6-2.1 3.4-3.3 3.4-4.7 2.2"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #9a8983;">تعاملات</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; position: relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a8983" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.5 6.6L4 20l1.1-3.6A7.9 7.9 0 0 1 4 12z"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #9a8983;">گفتگوها</span>
      <span style="position: absolute; top: 6px; inset-inline-end: 26px; width: 8px; height: 8px; border-radius: 50%; background: #e4552a;"></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a8983" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #9a8983;">پروفایل</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
