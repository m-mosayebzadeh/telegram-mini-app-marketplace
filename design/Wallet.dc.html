<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff6b3d; } a:hover { color: #ff8a64; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #151011; color: #faf6f4; font-family: Vazirmatn, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px;">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#faf6f4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M5 12l4 4M5 12l4-4"/></svg>
    </div>
    <span style="flex-grow: 1; font-size: 17px; font-weight: 700;">کیف پول</span>
  </div>

  <!-- balance: no card, no gradient — size and space do the work -->
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 20px 20px 0;">
    <span style="font-size: 13px; font-weight: 600; color: #a89a95;">موجودی قابل‌خرج</span>
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 40px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums;">۱٬۹۲۰٬۰۰۰</span>
      <span style="font-size: 16px; font-weight: 600; color: #a89a95;">تومان</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#ff6b3d"><path d="M12 2.8C12 2.8 5.9 9.6 5.9 14a6.1 6.1 0 0 0 12.2 0c0-4.4-6.1-11.2-6.1-11.2Z"/></svg>
      <span style="font-size: 14px; color: #a89a95; font-variant-numeric: tabular-nums;">حدود ۴۸۰ دراپ</span>
    </div>
  </div>

  <!-- in-flight money, stated plainly rather than as a second colored card -->
  <div style="display: flex; align-items: center; gap: 10px; margin: 20px 20px 0; padding: 14px 16px; border-radius: 12px; background: #1f1918;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a89a95" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 14px; font-weight: 600;">۴۰۰٬۰۰۰ تومان در جریان</span>
      <span style="font-size: 12px; color: #6e635f;">بعد از پایان گفتگو آزاد می‌شود</span>
    </div>
  </div>

  <!-- two actions, equal weight: one fills, one outlines -->
  <div style="display: flex; gap: 10px; padding: 20px 20px 0;">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 48px; border-radius: 12px; background: #ff6b3d; color: #fff; font-size: 15px; font-weight: 700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      شارژ
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 48px; border-radius: 12px; background: #1f1918; border: 1px solid #342b29; font-size: 15px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#faf6f4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>
      برداشت
    </div>
  </div>

  <!-- history -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 32px 20px 4px;">
    <span style="font-size: 15px; font-weight: 700;">تراکنش‌ها</span>
    <span style="font-size: 13px; font-weight: 600; color: #ff6b3d;">همه</span>
  </div>

  <div style="display: flex; flex-direction: column; padding: 8px 20px 0;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; min-height: 44px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #1f1918; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3fbf7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M7 10l5-5 5 5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600;">شارژ با دراپ</span>
        <span style="font-size: 12px; color: #6e635f;">امروز، ۱۴:۳۰</span>
      </div>
      <span style="font-size: 15px; font-weight: 700; color: #3fbf7f; font-variant-numeric: tabular-nums;">‎+۴۰۰٬۰۰۰</span>
    </div>

    <div style="height: 1px; background: #241d1c;"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; min-height: 44px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #1f1918; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a89a95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M7 14l5 5 5-5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600;">گفتگو با نیلوفر</span>
        <span style="font-size: 12px; color: #6e635f;">دیروز، ۲۱:۰۵</span>
      </div>
      <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;">‎−۲۰۰٬۰۰۰</span>
    </div>

    <div style="height: 1px; background: #241d1c;"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; min-height: 44px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #1f1918; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3fbf7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M7 10l5-5 5 5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600;">درآمد از گفتگو</span>
        <span style="font-size: 12px; color: #6e635f;">۳ روز پیش</span>
      </div>
      <span style="font-size: 15px; font-weight: 700; color: #3fbf7f; font-variant-numeric: tabular-nums;">‎+۳۶۰٬۰۰۰</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
