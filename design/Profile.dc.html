<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff6b3d; } a:hover { color: #ff8a64; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; background: #151011; color: #faf6f4; font-family: Vazirmatn, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 8px;">
    <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px;">پروفایل</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: #1f1918; border: 1px solid #342b29;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff6b3d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8C12 2.8 5.9 9.6 5.9 14a6.1 6.1 0 0 0 12.2 0c0-4.4-6.1-11.2-6.1-11.2Z"/></svg>
        <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">۴۸۰</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 999px; background: #1f1918; border: 1px solid #342b29;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a89a95" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h10M18 17h2"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>
      </div>
    </div>
  </div>

  <!-- identity -->
  <div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px 0;">
    <div style="width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(155deg, #5a2f25 0%, #8a4436 50%, #3b2420 100%);"></div>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.2px;">سهیل</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ff6b3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-10"/></svg>
      </div>
      <span style="font-size: 14px; color: #a89a95;">@soheil</span>
      <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a89a95" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3 12 12 0 0 1-8.5 15A12 12 0 0 1 3.5 6 12 12 0 0 0 12 3z"/></svg>
        <span style="font-size: 12px; font-weight: 500; color: #a89a95;">پروفایل معتبر</span>
      </div>
    </div>
  </div>

  <!-- bio -->
  <p style="margin: 16px 20px 0; font-size: 15px; line-height: 26px; color: #d6cbc7;">شب‌ها بیدارم. اگه حوصله‌ت سر رفته یا فقط می‌خوای یکی گوش بده، بنویس.</p>

  <!-- stats -->
  <div style="display: flex; gap: 8px; padding: 20px 20px 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; background: #1f1918;">
      <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">۱۲۴</span>
      <span style="font-size: 12px; color: #a89a95;">دنبال‌کننده</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; background: #1f1918;">
      <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">۳۸</span>
      <span style="font-size: 12px; color: #a89a95;">دنبال‌شونده</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; background: #1f1918;">
      <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">۹</span>
      <span style="font-size: 12px; color: #a89a95;">گفتگو</span>
    </div>
  </div>

  <!-- action -->
  <div style="padding: 16px 20px 0;">
    <div style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: #1f1918; border: 1px solid #342b29; font-size: 15px; font-weight: 600;">ویرایش پروفایل</div>
  </div>

  <!-- tabs -->
  <div style="display: flex; gap: 24px; padding: 24px 20px 0; border-bottom: 1px solid #241d1c;">
    <div style="padding-bottom: 12px; border-bottom: 2px solid #ff6b3d; font-size: 15px; font-weight: 700; color: #faf6f4;">مدیا</div>
    <div style="padding-bottom: 12px; font-size: 15px; font-weight: 600; color: #6e635f;">پیشنهادها</div>
  </div>

  <!-- grid -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px 0 0;">
    <div style="aspect-ratio: 1; background: linear-gradient(150deg, #4a2f28 0%, #7a4436 100%);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(150deg, #3f3326 0%, #6b5233 100%);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(150deg, #2e2320 0%, #56382c 100%); position: relative;">
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,7,7,0.55);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </div>
    </div>
    <div style="aspect-ratio: 1; background: linear-gradient(150deg, #43302a 0%, #6e4a3a 100%);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(150deg, #352a24 0%, #5f4632 100%);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(150deg, #4d3226 0%, #82503a 100%);"></div>
  </div>

  <!-- bottom nav -->
  <div style="margin-top: auto; display: flex; align-items: stretch; padding: 8px 12px 22px; background: #151011; border-top: 1px solid #241d1c;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6e635f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #6e635f;">ویترین</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6e635f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c2.3-3.3.2-7.8-1-8.9 0 3.4-2.2 5.3-3.7 6.7S5 12.1 5 14.4c0 3.7 3.1 6.7 7 6.7s7-3 7-6.7c0-1.7-1.2-4.4-2.3-5.6-2.1 3.4-3.3 3.4-4.7 2.2"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #6e635f;">تعاملات</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6e635f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.5 6.6L4 20l1.1-3.6A7.9 7.9 0 0 1 4 12z"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #6e635f;">گفتگوها</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff6b3d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #ff6b3d;">پروفایل</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
