<!--
  Drop — the app's own currency unit (replaces Telegram Stars in the UI).
  A single drop silhouette with a flame core: at small sizes the outer
  shape alone carries it, so the core is optional below ~20px.
  Grid 24x24, matches the app's other icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- solid mark: use this in chips, prices, balances -->
  <path fill="#FF6B3D" d="M12 2.8C12 2.8 5.9 9.6 5.9 14a6.1 6.1 0 0 0 12.2 0c0-4.4-6.1-11.2-6.1-11.2Z"/>
  <!-- flame core: cut out in the surface color at 24px and up -->
  <path fill="#151011" fill-opacity="0.34" d="M12 18.3a3.3 3.3 0 0 1-3.3-3.3c0-2.1 3.3-5 3.3-5s3.3 2.9 3.3 5a3.3 3.3 0 0 1-3.3 3.3Z"/>
</svg>
