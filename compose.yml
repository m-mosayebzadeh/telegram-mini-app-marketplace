services:

  backend:
    image: telegram-mini-backend:local
    container_name: telegram-mini-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - backend_data:/app/data

  frontend:
    image: telegram-mini-frontend:local
    container_name: telegram-mini-frontend

  nginx:
    image: nginx:alpine
    container_name: telegram-mini-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  backend_data: