services:

  # The database the app actually runs on, in development as well as in
  # production. Postgres locks rows; SQLite serialises every write and has no
  # row locks at all — and the money code depends on that difference, so the
  # two are not interchangeable here.
  db:
    image: postgres:16-alpine
    container_name: telegram-mini-db
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: marketplace
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Exposed so the test suite and a local backend can reach it from the
      # host. 5433 rather than 5432 to stay out of the way of any Postgres
      # already installed on the machine.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: telegram-mini-backend:local
    container_name: telegram-mini-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://marketplace:${POSTGRES_PASSWORD:-devpass}@db:5432/marketplace
    depends_on:
      db:
        # Migrations run on startup, so the app must not begin before the
        # database can answer.
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  frontend:
    image: telegram-mini-frontend:local
    container_name: telegram-mini-frontend

  nginx:
    image: nginx:alpine
    container_name: telegram-mini-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  backend_data:
  db_data: